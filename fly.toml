# fly.toml app configuration file generated for budgeteer-marbled-snowfall-2406 on 2026-07-29T08:48:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'budgeteer-marbled-snowfall-2406'
primary_region = 'cdg'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'budgeteer-marbled-snowfall-2406.fly.dev'
  PORT = '8080'
  STATEMENT_STORAGE_PATH = '/data/statements'
  RECIPE_IMAGE_STORAGE_PATH = '/data/recipe_images'

[[mounts]]
  source = 'budgeteer_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Oban's daily summary cron runs inside the Phoenix machine. Keep one
  # machine alive so scheduled work is not skipped when there is no HTTP
  # traffic to trigger auto-start.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health/live'
    protocol = 'http'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health/ready'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
